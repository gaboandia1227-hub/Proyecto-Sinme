name: CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: CI - Verificar HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Verificar que index.html existe y es valido
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: no existe index.html"
            exit 1
          fi
          if ! grep -q "<html" index.html; then
            echo "ERROR: index.html no tiene estructura HTML valida"
            exit 1
          fi
          echo "index.html paso la verificacion"

  build:
    name: CD - Preparar artefacto
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: CD - Desplegar a GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
